<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/admin.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Panel de administración</h1>
            <p class="subtitle">Iniciá sesión para gestionar el catálogo</p>
        </div>
    </header>

    <main class="container login-main">
        <section class="login-card">
            <h2>Iniciar sesión</h2>
            <form id="loginForm" class="admin-form">
                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" required>

                <div class="admin-form-actions">
                    <button type="submit" id="submitBtn" class="btn-search">Ingresar</button>
                </div>
                <p id="formMessage" class="form-message hidden"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p><a href="index.html">&larr; Volver a la tienda</a></p>
        </div>
    </footer>

    <script src="../scripts/login.mjs"></script>
</body>
</html>
