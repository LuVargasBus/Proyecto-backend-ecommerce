<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de productos</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/admin.css">
</head>
<body>
    <header>
        <div class="container admin-header-bar">
            <div>
                <h1>Administración de productos</h1>
                <p class="subtitle">Alta, baja, modificación y consulta del catálogo</p>
            </div>
            <button type="button" id="logoutBtn" class="btn-logout">Cerrar sesión</button>
        </div>
    </header>

    <main class="container admin-main">
        <section class="admin-form-section">
            <h2 id="formTitle">Nuevo producto</h2>
            <form id="productForm" class="admin-form">
                <input type="hidden" id="productId">

                <label for="name">Nombre</label>
                <input type="text" id="name" required>

                <label for="price">Precio</label>
                <input type="number" id="price" min="0" step="0.01" required>

                <label for="category">Categoría</label>
                <input type="text" id="category" required>

                <label for="size">Talles (separados por coma, ej: S,M,L)</label>
                <input type="text" id="size" placeholder="S,M,L">

                <label for="stock">Stock</label>
                <input type="number" id="stock" min="0" step="1" required>

                <label for="image">Imagen</label>
                <input type="file" id="image" accept="image/*">
                <p id="currentImageInfo" class="current-image-info hidden"></p>

                <div class="admin-form-actions">
                    <button type="submit" id="submitBtn" class="btn-search">Guardar</button>
                    <button type="button" id="cancelBtn" class="btn-cancel hidden">Cancelar edición</button>
                </div>
                <p id="formMessage" class="form-message hidden"></p>
            </form>
        </section>

        <section class="admin-list-section">
            <h2>Productos cargados</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Talles</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <div class="container">
            <p><a href="index.html">&larr; Volver a la tienda</a></p>
        </div>
    </footer>

    <script src="../scripts/admin.mjs"></script>
</body>
</html>
