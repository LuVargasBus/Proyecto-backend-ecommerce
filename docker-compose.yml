services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: tienda
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d tienda"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PUERTO: 3000
      NODE_ENV: development
      BD_HOST: db
      BD_PORT: 5432
      BD_USER: root
      BD_PASS: pass
      BD_BD: tienda
      JWT_SECRET: clave_secreta_de_firma_tp4
      JWT_EXPIRES_IN: 1h
      CORS_ORIGINS: ""
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
